name: desktop-build

on:
  release:
    # `published` — NOT `created`. GitHub does not fire release `created` for
    # draft releases, and the UI saves as a draft by default, so a
    # draft-then-publish flow silently built nothing. `published` fires both
    # when a release is published directly and when a draft is published.
    types: [published]
  # Lets an existing release be (re)built without cutting a new one.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach assets to (e.g. v0.3.32)'
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Single source for the tag across both trigger types.
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  desktop-linux:
    name: Desktop Build (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        # Must precede setup-node: `cache: 'pnpm'` resolves the store by
        # shelling out to `pnpm store path`, so pnpm has to exist first.
        # Version comes from `packageManager` in the root package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app (AppImage)
        run: pnpm --dir frontend_app tauri:build

      - name: Find Linux artifacts
        id: linux_paths
        run: |
          APPIMAGE_PATH=$(find desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)
          if [ -z "$APPIMAGE_PATH" ]; then
            echo "AppImage artifact not found" >&2
            exit 1
          fi
          CHECKSUM_PATH="${APPIMAGE_PATH}.sha256"
          echo "appimage_path=$APPIMAGE_PATH" >> $GITHUB_OUTPUT
          echo "appimage_checksum_path=$CHECKSUM_PATH" >> $GITHUB_OUTPUT

      - name: Generate SHA256 checksums (Linux)
        run: |
          APPIMAGE_PATH='${{ steps.linux_paths.outputs.appimage_path }}'
          CHECKSUM_PATH='${{ steps.linux_paths.outputs.appimage_checksum_path }}'
          sha256sum "$APPIMAGE_PATH" > "$CHECKSUM_PATH"

      - name: Upload Linux artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            '${{ steps.linux_paths.outputs.appimage_path }}#MindMapVault-Linux.AppImage' \
            '${{ steps.linux_paths.outputs.appimage_checksum_path }}#MindMapVault-Linux.AppImage.sha256' \
            --clobber


  desktop-macos:
    name: Desktop Build (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        # Must precede setup-node: `cache: 'pnpm'` resolves the store by
        # shelling out to `pnpm store path`, so pnpm has to exist first.
        # Version comes from `packageManager` in the root package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Signing is on only when the Apple secrets exist; without them the
      # build gets an ad-hoc signature, as before. Tauri reads these env vars
      # to sign with the Developer ID and notarize, with no change to the
      # build command. Exported only when set: an empty APPLE_CERTIFICATE
      # would make tauri try to import nothing and fail.
      - name: Set up Apple signing
        id: apple
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$CERT" ] || [ -z "$API_PRIVATE_KEY" ]; then
            echo "::notice::Apple signing secrets not set; the DMG gets an ad-hoc signature."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
          printf '%s\n' "$API_PRIVATE_KEY" > "$key_path"
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_API_KEY=$API_KEY"
            echo "APPLE_API_ISSUER=$API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build desktop app (universal DMG)
        run: pnpm --dir frontend_app tauri:build --target universal-apple-darwin

      - name: Find macOS artifacts
        id: mac_paths
        run: |
          DMG_PATH=$(find desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "DMG artifact not found" >&2
            exit 1
          fi
          CHECKSUM_PATH="${DMG_PATH}.sha256"
          echo "dmg_path=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "dmg_checksum_path=$CHECKSUM_PATH" >> $GITHUB_OUTPUT

      # The DMG bundler deletes bundle/macos/*.app once the DMG is built, so
      # assert against the lipo'd binary that tauri produced instead.
      - name: Verify universal binary slices
        run: |
          APP_BIN=desktop/src-tauri/target/universal-apple-darwin/release/MindMapVault-foss
          lipo -archs "$APP_BIN"
          lipo -archs "$APP_BIN" | grep -q arm64
          lipo -archs "$APP_BIN" | grep -q x86_64
          if [ '${{ steps.apple.outputs.signed }}' != 'true' ]; then
            codesign -dv "$APP_BIN" 2>&1 | grep -q 'Signature=adhoc'
          fi

      # What a user's Mac checks: the app in the DMG is signed with the
      # Developer ID, notarized, and has the ticket stapled.
      - name: Verify signature and notarization
        if: steps.apple.outputs.signed == 'true'
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" '${{ steps.mac_paths.outputs.dmg_path }}'
          app=$(find "$mnt" -maxdepth 1 -name '*.app' | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -q 'Authority=Developer ID Application'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          hdiutil detach "$mnt"

      - name: Generate SHA256 checksums (macOS)
        run: |
          DMG_PATH='${{ steps.mac_paths.outputs.dmg_path }}'
          CHECKSUM_PATH='${{ steps.mac_paths.outputs.dmg_checksum_path }}'
          shasum -a 256 "$DMG_PATH" | awk '{print $1 "  " "'"$(basename "$DMG_PATH")"'"}' > "$CHECKSUM_PATH"

      - name: Upload macOS artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            '${{ steps.mac_paths.outputs.dmg_path }}#MindMapVault-macOS.dmg' \
            '${{ steps.mac_paths.outputs.dmg_checksum_path }}#MindMapVault-macOS.dmg.sha256' \
            --clobber

  desktop-windows:
    name: Desktop Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        # Must precede setup-node: `cache: 'pnpm'` resolves the store by
        # shelling out to `pnpm store path`, so pnpm has to exist first.
        # Version comes from `packageManager` in the root package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app (NSIS + EXE)
        run: pnpm --dir frontend_app tauri:build

      - name: Find Windows artifacts
        id: win_paths
        shell: powershell
        run: |
          $exe = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) {
            throw "Windows NSIS installer artifact not found"
          }
          $checksumPath = "$($exe.FullName).sha256"
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "exe_checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Generate SHA256 checksums (Windows)
        shell: powershell
        run: |
          $exePath = "${{ steps.win_paths.outputs.exe_path }}"
          $checksumPath = "${{ steps.win_paths.outputs.exe_checksum_path }}"
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path -Path $exePath -Leaf)" | Out-File -FilePath $checksumPath -Encoding ascii

      - name: Upload Windows artifacts to release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:RELEASE_TAG `
            '${{ steps.win_paths.outputs.exe_path }}#MindMapVault-Windows.exe' `
            '${{ steps.win_paths.outputs.exe_checksum_path }}#MindMapVault-Windows.exe.sha256' `
            --clobber
